<span class="row-1 col-2 centered text-large team-red">{{ name }}</span>
<div class="count">{{ count }}</div>
<img class="icon row-3 col-2 centered" [src]="icon" />
<div class="row-4 col-2">
  <fail-indicator
    [fails]="fails"
    [failsMax]="maxFails"
    (failed)="failed.emit($event)"
  ></fail-indicator>
</div>
