<div class="tp-box"
     (click)="toggleFlip()"
     [@flipState]="flip">
  <div class="tp-box__side tp-box__front">
      <span class="centered text-large">— {{id}} —</span>
  </div>
  <div class="tp-box__side tp-box__back">
    <div class="answer">
      <span class="centered text-large">{{answer}}</span>
    </div>
    <div class="answer-price">
      <span class="centered text-large">
        {{points}}
      </span>
    </div>
  </div>
</div>
