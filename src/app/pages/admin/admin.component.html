<div class="content" [formGroup]="gameForm">
  <!-- TODO: move to Header component of Editor component -->
  <div class="navbar">
    <button [routerLink]="['']" class="button-mar" mat-icon-button>
      <mat-icon>arrow_back</mat-icon>
    </button>

    @if (!editGameName) {
      <h1 class="header">
        {{ gameForm["controls"].gameName.value }}
        @if (unsavedChanges) {
          <span>*</span>
        }
      </h1>
    }

    @if (editGameName) {
      <mat-form-field>
        <input formControlName="gameName" matInput />
      </mat-form-field>
    }
    <button
      (click)="editGameName = !editGameName"
      class="button-mar"
      mat-icon-button
      >
      @if (!editGameName) {
        <mat-icon>create</mat-icon>
      }
      @if (editGameName) {
        <mat-icon>done</mat-icon>
      }
    </button>
  </div>

  <!-- TODO: separate to some components of Editor component -->
  <div class="constructor">
    <mat-tab-group
      [(selectedIndex)]="currentQuestion"
      (selectedTabChange)="onSelectedTabChange($event)"
      >
      @for (q of questions['controls']; track q; let i = $index) {
        <mat-tab
          [disabled]="i === maxQuestions"
          formArrayName="questions"
          label="{{ q['controls'].stageName.value }}"
          >
          <div class="question" formGroupName="{{ i }}">
            <mat-form-field>
              <mat-label>Название этапа</mat-label>
              <input
                formControlName="stageName"
                type="text"
                maxlength="30"
                matInput
                />
            </mat-form-field>
            <br />
            <mat-form-field>
              <mat-label>Текст вопроса</mat-label>
              <textarea formControlName="questionText" matInput></textarea>
            </mat-form-field>
            <div class="answers-block">
              <div class="answers-block__header">Ответы</div>
              @for (a of q['controls'].answers['controls']; track a; let j = $index) {
                <div
                  formArrayName="answers"
                  >
                  <div formGroupName="{{ j }}">
                    <mat-form-field class="form-content">
                      <input
                        formControlName="name"
                        type="text"
                        maxlength="30"
                        matInput
                        />
                    </mat-form-field>
                    <mat-form-field class="form-content">
                      <input
                        formControlName="points"
                        type="number"
                        maxlength="10"
                        matInput
                        />
                    </mat-form-field>
                    <button
                      (click)="onRemoveAnswer(i, j)"
                      [disabled]="q['controls'].answers['controls'].length === 1"
                      class="form-content"
                      mat-icon-button
                      >
                      <mat-icon>remove_circle_outline</mat-icon>
                    </button>
                  </div>
                </div>
              }
              <button
                (click)="onAddAnswer(i)"
                class="capitalize button-mar"
                mat-stroked-button
                >
                <mat-icon>add_circle_outline</mat-icon> Добавить ответ
              </button>
            </div>
            <button
              (click)="onRemoveQuestion(i)"
              [disabled]="questions.length - 1 <= minQuestions"
              class="capitalize"
              color="accent"
              mat-stroked-button
              >
              Удалить вопрос
            </button>
          </div>
        </mat-tab>
      }
    </mat-tab-group>
  </div>

  <!-- TODO: move to Footer component of Editor component -->
  <div class="footer-controls">
    <div>
      <button
        (click)="saveChanges()"
        color="primary"
        class="capitalize button-mar"
        mat-flat-button
        >
        <mat-icon>get_app</mat-icon>
        Сохранить
      </button>
      <button
        (click)="fileInput.click()"
        class="capitalize button-mar"
        mat-stroked-button
        >
        <mat-icon>publish</mat-icon>
        Загрузить
      </button>
      <input
        #fileInput
        (change)="onOpenFile()"
        type="file"
        id="fileInput"
        hidden
        />
    </div>
    <div>
      <button
        (click)="startGame(false)"
        class="capitalize button-mar"
        mat-stroked-button
        >
        <mat-icon>public_off</mat-icon>
        Играть локально
      </button>
      <button
        (click)="startGame(true)"
        class="capitalize button-mar"
        color="primary"
        type="submit"
        disabled
        mat-flat-button
        >
        <mat-icon>public</mat-icon>
        Играть онлайн
      </button>
    </div>
  </div>
</div>
